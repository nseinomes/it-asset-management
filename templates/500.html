{% extends "base.html" %}

{% block title %}500 - Server Error{% endblock %}

{% block content %}

<style>
    .error-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 60vh;
        text-align: center;
        padding: 40px 20px;
    }

    .error-code {
        font-size: 120px;
        font-weight: 700;
        color: #e74a3b;
        line-height: 1;
        margin-bottom: 20px;
    }

    .error-title {
        font-size: 36px;
        font-weight: 600;
        color: #1a1f2e;
        margin-bottom: 10px;
    }

    .error-message {
        font-size: 16px;
        color: #6b7280;
        margin-bottom: 30px;
        max-width: 500px;
    }

    .error-icon {
        font-size: 80px;
        margin-bottom: 20px;
    }

    .btn-back {
        background: #4e73df;
        color: white;
        border: none;
        padding: 12px 28px;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
        transition: background 0.2s;
        display: inline-block;
    }

    .btn-back:hover {
        background: #2e59d9;
        color: white;
    }
</style>

<div class="error-container">
    <div class="error-icon">⚠️</div>
    <div class="error-code">500</div>
    <div class="error-title">Server Error</div>
    <div class="error-message">
        Something went wrong on our end. Please try again later or contact support.
    </div>
    <a href="/dashboard" class="btn-back">← Back to Dashboard</a>
</div>

{% endblock %}
