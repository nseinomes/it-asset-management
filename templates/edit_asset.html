{% extends "base.html" %}
{% block title %}Edit Asset{% endblock %}

{% block content %}

<style>
    .form-wrap { max-width: 700px; }

    .form-section {
        font-size: 11px;
        font-weight: 700;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.8px;
        margin: 24px 0 12px;
        padding-bottom: 8px;
        border-bottom: 1px solid var(--border);
    }
    .form-section:first-child { margin-top: 0; }

    .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0 20px;
    }
    .form-grid .span-2 { grid-column: 1 / -1; }

    .field { margin-bottom: 16px; }

    .field label {
        display: block;
        font-size: 12px;
        font-weight: 600;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.4px;
        margin-bottom: 5px;
    }

    .form-actions {
        display: flex;
        gap: 10px;
        margin-top: 28px;
        padding-top: 20px;
        border-top: 1px solid var(--border);
    }
</style>

<div class="page-header">
    <h1>Edit Asset</h1>
    <a href="/assets" class="btn-secondary">← Back</a>
</div>

<div class="card-surface form-wrap" style="padding: 28px 32px;">
    <form method="POST">

        <div class="form-section">Basic Info</div>
        <div class="form-grid">
            <div class="field">
                <label>Asset Tag *</label>
                <input class="form-input" type="text" name="asset_tag"
                       value="{{ asset.asset_tag }}" required>
            </div>
            <div class="field">
                <label>Status *</label>
                <select class="form-input" name="status" style="appearance:auto;">
                    <option value="Active"      {% if asset.status == 'Active' %}selected{% endif %}>Active</option>
                    <option value="Maintenance" {% if asset.status == 'Maintenance' %}selected{% endif %}>Maintenance</option>
                    <option value="Inactive"    {% if asset.status == 'Inactive' %}selected{% endif %}>Inactive</option>
                </select>
            </div>
            <div class="field span-2">
                <label>Name *</label>
                <input class="form-input" type="text" name="name"
                       value="{{ asset.name }}" required>
            </div>
        </div>

        <div class="form-section">Device Details</div>
        <div class="form-grid">
            <div class="field">
                <label>Brand</label>
                <input class="form-input" type="text" name="brand"
                       value="{{ asset.brand or '' }}" placeholder="e.g. Dell, HP, Apple">
            </div>
            <div class="field">
                <label>Model</label>
                <input class="form-input" type="text" name="model"
                       value="{{ asset.model or '' }}" placeholder="e.g. XPS 15">
            </div>
            <div class="field">
                <label>Serial Number</label>
                <input class="form-input" type="text" name="serial_number"
                       value="{{ asset.serial_number or '' }}" placeholder="S/N">
            </div>
            <div class="field">
                <label>Category</label>
                <select class="form-input" name="category_id" style="appearance:auto;">
                    <option value="">— No category —</option>
                    {% for cat in categories %}
                    <option value="{{ cat.id }}"
                        {% if asset.category_id == cat.id %}selected{% endif %}>
                        {{ cat.name }}
                    </option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="form-section">Location & Dates</div>
        <div class="form-grid">
            <div class="field">
                <label>Location</label>
                <input class="form-input" type="text" name="location"
                       value="{{ asset.location or '' }}" placeholder="e.g. Room 2A">
            </div>
            <div class="field">
                <label>Purchase Date</label>
                <input class="form-input" type="date" name="purchase_date"
                    value="{{ asset.purchase_date.strftime('%Y-%m-%d') if asset.purchase_date else '' }}">
            </div>
            <div class="field">
                <label>Warranty Expiration</label>
                <input class="form-input" type="date" name="warranty_expiration"
                    value="{{ asset.warranty_expiration.strftime('%Y-%m-%d') if asset.warranty_expiration else '' }}">
            </div>
        </div>

        <div class="form-section">Notes</div>
        <div class="field">
            <textarea class="form-input" name="notes" rows="3"
                      style="resize:vertical;"
                      placeholder="Additional notes…">{{ asset.notes or '' }}</textarea>
        </div>

        <div class="form-actions">
            <a href="/assets" class="btn-secondary">Cancel</a>
            <button type="submit" class="btn-primary">Update Asset</button>
        </div>

    </form>
</div>

{% endblock %}
