{% extends "base.html" %}
{% block title %}Edit Category{% endblock %}

{% block content %}

<style>
    .form-wrap { max-width: 420px; }

    .field { margin-bottom: 16px; }

    .field label {
        display: block;
        font-size: 12px;
        font-weight: 600;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.4px;
        margin-bottom: 5px;
    }

    .form-actions {
        display: flex;
        gap: 10px;
        margin-top: 24px;
        padding-top: 20px;
        border-top: 1px solid var(--border);
    }

    .alert-inline {
        background: #fff1f2;
        border: 1px solid #fecdd3;
        color: #be123c;
        border-radius: 8px;
        padding: 10px 14px;
        font-size: 13px;
        margin-bottom: 20px;
    }
</style>

<div class="page-header">
    <h1>Edit Category</h1>
    <a href="/categories" class="btn-secondary">← Back</a>
</div>

<div class="card-surface form-wrap" style="padding: 24px 28px;">
    {% if error %}
    <div class="alert-inline">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/categories/edit/{{ category.id }}">
        <div class="field" style="margin-bottom:24px;">
            <label>Name *</label>
            <input class="form-input" type="text" name="name"
                   value="{{ category.name }}" maxlength="100" required
                   placeholder="Category name">
        </div>

        <div class="form-actions">
            <a href="/categories" class="btn-secondary" style="flex:1; justify-content:center;">Cancel</a>
            <button type="submit" class="btn-primary" style="flex:1; justify-content:center;">Save Changes</button>
        </div>
    </form>
</div>

{% endblock %}
