{% extends "base.html" %}
{% block title %}Edit User{% endblock %}

{% block content %}

<style>
    .form-wrap { max-width: 460px; }

    .field { margin-bottom: 16px; }

    .field label {
        display: block;
        font-size: 12px;
        font-weight: 600;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.4px;
        margin-bottom: 5px;
    }

    .field-hint {
        font-size: 12px;
        color: var(--text-muted);
        margin-top: -10px;
        margin-bottom: 12px;
    }

    .form-actions {
        display: flex;
        gap: 10px;
        margin-top: 24px;
        padding-top: 20px;
        border-top: 1px solid var(--border);
    }

    .alert-inline {
        background: #fff1f2;
        border: 1px solid #fecdd3;
        color: #be123c;
        border-radius: 8px;
        padding: 10px 14px;
        font-size: 13px;
        margin-bottom: 20px;
    }

    .user-meta {
        font-size: 13px;
        color: var(--text-muted);
        margin-bottom: 20px;
        padding-bottom: 16px;
        border-bottom: 1px solid var(--border);
    }
    .user-meta strong { color: var(--text-primary); }
</style>

<div class="page-header">
    <h1>Edit User</h1>
    <a href="/users" class="btn-secondary">← Back</a>
</div>

<div class="card-surface form-wrap" style="padding: 24px 28px;">
    <p class="user-meta">Editing account: <strong>{{ user.username }}</strong></p>

    {% if error %}
    <div class="alert-inline">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/users/edit/{{ user.id }}">
        <div class="field">
            <label>Role *</label>
            <select class="form-input" name="role_id" required style="appearance:auto;">
                {% for role in roles %}
                <option value="{{ role.id }}" {% if role.id == user.role_id %}selected{% endif %}>
                    {{ role.name }}
                </option>
                {% endfor %}
            </select>
        </div>

        <div class="field">
            <label>New Password</label>
            <input class="form-input" type="password" name="password"
                   placeholder="Leave blank to keep current" minlength="8"
                   autocomplete="new-password">
        </div>
        <p class="field-hint">Minimum 8 characters. Leave blank to keep the existing password.</p>

        <div class="form-actions">
            <a href="/users" class="btn-secondary" style="flex:1; justify-content:center;">Cancel</a>
            <button type="submit" class="btn-primary" style="flex:1; justify-content:center;">Save Changes</button>
        </div>
    </form>
</div>

{% endblock %}
