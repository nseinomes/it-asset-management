<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — Evolve IT Asset Management</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            background: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .login-wrapper {
            width: 100%;
            max-width: 420px;
        }

        .login-card {
            background: #fff;
            border-radius: 16px;
            padding: 44px 40px 40px;
            box-shadow: 0 4px 24px rgba(15,23,42,0.08), 0 1px 4px rgba(15,23,42,0.04);
            border: 1px solid #e2e8f0;
        }

        .login-logo {
            display: block;
            height: 36px;
            width: auto;
            margin: 0 auto 28px;
        }

        .login-heading {
            font-size: 22px;
            font-weight: 700;
            color: #0f172a;
            text-align: center;
            margin-bottom: 4px;
        }

        .login-sub {
            font-size: 13.5px;
            color: #64748b;
            text-align: center;
            margin-bottom: 32px;
        }

        .field {
            margin-bottom: 18px;
        }

        .field label {
            display: block;
            font-size: 12.5px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 6px;
            letter-spacing: 0.01em;
        }

        .field input {
            width: 100%;
            padding: 11px 14px;
            border: 1.5px solid #e2e8f0;
            border-radius: 9px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            color: #0f172a;
            background: #fff;
            transition: border-color 0.15s, box-shadow 0.15s;
            outline: none;
        }

        .field input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37,99,235,0.12);
        }

        .field input::placeholder { color: #94a3b8; }

        .error-banner {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #fff1f2;
            border: 1px solid #fecdd3;
            color: #be123c;
            border-radius: 9px;
            padding: 11px 14px;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 20px;
        }

        .btn-signin {
            width: 100%;
            padding: 12px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 9px;
            font-size: 14px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: background 0.15s, box-shadow 0.15s;
            margin-top: 8px;
        }

        .btn-signin:hover {
            background: #1d4ed8;
            box-shadow: 0 4px 12px rgba(37,99,235,0.3);
        }

        .login-footer {
            text-align: center;
            margin-top: 28px;
            font-size: 12px;
            color: #94a3b8;
        }
    </style>
</head>
<body>

<div class="login-wrapper">
    <div class="login-card">
        <img src="{{ url_for('static', filename='images/evolve_logo.png') }}"
             alt="Evolve" class="login-logo">

        <h1 class="login-heading">Welcome back</h1>
        <p class="login-sub">Sign in to IT Asset Management</p>

        {% if error %}
        <div class="error-banner">
            <span>⚠</span> {{ error }}
        </div>
        {% endif %}

        <form method="POST" autocomplete="on">
            <div class="field">
                <label for="username">Username</label>
                <input id="username" type="text" name="username"
                       placeholder="Enter your username"
                       autocomplete="username" required autofocus>
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input id="password" type="password" name="password"
                       placeholder="••••••••"
                       autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn-signin">Sign In →</button>
        </form>
    </div>

    <div class="login-footer">Evolve SRL · IT Asset Management</div>
</div>

</body>
</html>
